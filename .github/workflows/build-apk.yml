name: Build CreatorLens APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Restore stable development signing key
        env:
          CREATORLENS_KEYSTORE_B64: ${{ secrets.CREATORLENS_KEYSTORE_B64 }}
        run: |
          echo "$CREATORLENS_KEYSTORE_B64" | base64 -d > app/creatorlens-debug.keystore

      - name: Apply real YouTube Analytics patch
        run: python3 patch_analytics.py

      - name: Apply CreatorLens tool usability patch
        run: python3 patch_toolfix.py

      - name: Apply modern OAuth Activity Result patch
        run: python3 patch_modern_oauth.py

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorLens-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
