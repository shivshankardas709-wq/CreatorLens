plugins { id 'com.android.application' }

android {
    namespace 'com.creatorlens.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.creatorlens.app'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        creatorLensDebug {
            storeFile file('creatorlens-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.creatorLensDebug }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'androidx.activity:activity:1.10.1'
}
